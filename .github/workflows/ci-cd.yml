name: Lint and Test pipeline

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    lint:
        name: Lint & Static Analysis
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  # pre-commit needs the base commit present to diff against it
                  fetch-depth: 0

            - name: Install uv
              uses: astral-sh/setup-uv@v5
              with:
                  enable-cache: true

            - name: Install Task
              uses: arduino/setup-task@v1
              with:
                  version: 3.x
                  repo-token: ${{ secrets.GITHUB_TOKEN }}

            - name: Cache pre-commit environments
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pre-commit
                  key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

            - name: Install dependencies
              run: task install

            # A PR is linted on what it changed, the way a commit is. Empty refs mean the
            # whole tree: a push with no usable base (new branch, force-push), or a change
            # to something that governs files it does not itself contain.
            - name: Resolve the diff range
              id: range
              env:
                  EVENT: ${{ github.event_name }}
                  PR_BASE: ${{ github.event.pull_request.base.sha }}
                  PR_HEAD: ${{ github.event.pull_request.head.sha }}
                  PUSH_BEFORE: ${{ github.event.before }}
                  PUSH_AFTER: ${{ github.sha }}
                  ZERO: "0000000000000000000000000000000000000000"
                  # Editing a schema or a linter's config changes the verdict on files the
                  # diff never touches, so scoping would silently skip them.
                  GOVERNING: '^(\.pre-commit-config\.yaml|\.yamllint\.yml|\.ansible-lint|\.gitleaksignore|schemas/|ansible/ansible\.cfg|tools/dev/run-ansible-lint\.sh)'
              run: |
                  if [ "$EVENT" = "pull_request" ]; then
                      from="$PR_BASE" to="$PR_HEAD"
                  elif [ "$PUSH_BEFORE" != "$ZERO" ]; then
                      from="$PUSH_BEFORE" to="$PUSH_AFTER"
                  else
                      echo "no usable base — linting the whole tree"; exit 0
                  fi

                  if git diff --name-only "$from...$to" | grep -qE "$GOVERNING"; then
                      echo "a governing file changed — linting the whole tree"; exit 0
                  fi
                  echo "from=$from" >>"$GITHUB_OUTPUT"
                  echo "to=$to" >>"$GITHUB_OUTPUT"

            - name: Run linting
              run: task lint
              env:
                  FROM_REF: ${{ steps.range.outputs.from }}
                  TO_REF: ${{ steps.range.outputs.to }}
