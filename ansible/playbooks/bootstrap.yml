# ansible/playbooks/bootstrap.yml
---
- name: Bootstrap homelab nodes
  hosts: all
  become: yes

  pre_tasks:
    - name: Display bootstrap information
      debug:
        msg: |
          Bootstrapping {{ inventory_hostname }}
          IP: {{ ansible_host }}
          User: {{ ansible_user }}

    - name: Gather facts
      setup:
        gather_subset:
          - '!all'
          - '!min'
          - hardware
          - network
          - virtual

  roles:
    - role: ../roles/common
      tags: ['common', 'base']

    - role: ../roles/storage
      tags: ['storage', 'iscsi']

    - role: ../roles/ssh
      tags: ['ssh', 'security']

    - role: ../roles/docker
      tags: ['docker', 'container']

    - role: ../roles/cifs
      tags: ['cifs', 'storage']

    - role: ../roles/gpu
      tags: ['gpu', 'nvidia']
      when:
        - node_labels is defined
        - node_labels.gpu | default(false)

    - role: ../roles/snmp
      tags: ['snmp', 'monitoring']

    - role: ../roles/tailscale
      tags: ['tailscale', 'vpn', 'network']
      when: tailscale_enabled | default(false)

    # - role: firewall # Excluded as per user's request
    #   tags: ['firewall', 'security']

  post_tasks:
    - name: Display completion message
      debug:
        msg: "✓ Bootstrap complete for {{ inventory_hostname }}"
