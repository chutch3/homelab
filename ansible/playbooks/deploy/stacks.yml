# ansible/playbooks/deploy/stacks.yml
---
- name: Deploy Docker Swarm stacks in dependency order
  hosts: managers
  tags: [deploy]
  vars:
    # Space- or comma-separated targets; empty means every stack.
    stacks: ""
    # Overridden by the e2e suite to point at its fixtures.
    stacks_root: "{{ repo_root }}"
    prune: true
    # `auto` registers records for new stacks only.
    register_dns: "auto"
    register_uptime: "auto"
    converge_retries: 60
    converge_delay: 5
    base_domain: "{{ lookup('env', 'BASE_DOMAIN') }}"
    repo_root: "{{ (playbook_dir ~ '/../../..') | realpath }}"
    target_stacks: "{{ stacks | regex_findall('[^,\\s]+') }}"

  tasks:
    - name: Verify Docker Swarm is active
      community.docker.docker_swarm_info:
      register: swarm_info
      failed_when: not swarm_info.docker_swarm_active
      run_once: true

    # The only source of order and of what is already converged, so a stack the
    # graph drops (PRIMARY_DNS_MANAGED) needs no filter here.
    - name: Resolve the deploy plan
      ansible.builtin.command:
        cmd: "uv run ci plan --json --repo-root {{ stacks_root }} {{ target_stacks | join(' ') }}"
        chdir: "{{ repo_root }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      register: deploy_plan

    - name: Read the plan
      ansible.builtin.set_fact:
        deploy_rows: "{{ deploy_plan.stdout | from_json }}"
      run_once: true

    - name: Report what the plan will do
      ansible.builtin.debug:
        msg: >-
          {{ to_deploy | length }} to deploy,
          {{ converged | length }} already converged
          ({{ converged | join(', ') or 'none' }})
      vars:
        to_deploy: "{{ deploy_rows | selectattr('action', 'equalto', 'deploy') | list }}"
        converged: "{{ deploy_rows | selectattr('action', 'equalto', 'skip') | map(attribute='stack') | list }}"
      run_once: true

    - name: Load .env file
      ansible.builtin.include_role:
        name: swarm
        tasks_from: load-env

    - name: Detect Docker context endpoint
      ansible.builtin.include_role:
        name: swarm
        tasks_from: get-docker-host

    - name: Ensure required overlay networks exist
      ansible.builtin.include_role:
        name: swarm
        tasks_from: ensure-networks

    # Each stack converges before the next starts, so a dependency that never
    # comes up fails the run instead of its dependents deploying against it.
    - name: Deploy each stack the plan calls for
      ansible.builtin.include_tasks: tasks/stack.yml
      vars:
        deploy_stack: "{{ item.stack }}"
        deploy_is_new: "{{ item.state == 'absent' }}"
      loop: "{{ deploy_rows | selectattr('action', 'equalto', 'deploy') | list }}"
      loop_control:
        label: "{{ item.stack }}"

    - name: Decide which stacks get their records registered
      ansible.builtin.set_fact:
        dns_registrations: >-
          {{ deployed | selectattr('new') | list if register_dns == 'auto'
             else (deployed if register_dns | bool else []) }}
        uptime_registrations: >-
          {{ (deployed | selectattr('new') | list if register_uptime == 'auto'
              else (deployed if register_uptime | bool else []))
             | rejectattr('stack', 'in', uptime_kuma_unmonitored) | list }}
      vars:
        deployed: "{{ deployed_stacks | default([]) }}"
        # Kuma cannot usefully watch what routes to it, resolves for it, or is it.
        uptime_kuma_unmonitored: [reverse-proxy, dns, uptime-kuma]

    - name: Wait for the DNS API to become available
      ansible.builtin.uri:
        url: "{{ dns_primary_api_url }}/user/login"
        method: POST
        body_format: form-urlencoded
        body:
          user: "admin"
          pass: "{{ primary_dns_api_key }}"
        status_code: 200
      register: dns_api_ready_check
      until: dns_api_ready_check.status | default(-1) == 200
      retries: 12
      delay: 5
      delegate_to: localhost
      when: "'dns' in (dns_registrations | map(attribute='stack') | list)"

    - name: Get DNS API token
      ansible.builtin.include_role:
        name: dns
        tasks_from: get-token
      when: dns_registrations | length > 0

    - name: Get Pi-hole API token
      ansible.builtin.include_role:
        name: dns
        tasks_from: get-pihole-token
      when:
        - dns_registrations | length > 0
        - secondary_dns_enabled | default(false) | bool
      ignore_errors: true

    - name: Register DNS records for each stack the run brought up  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: dns
        tasks_from: add-service-cnames
      vars:
        stack_name: "{{ item.stack }}"
        compose_file_path: "{{ item.compose }}"
      loop: "{{ dns_registrations }}"
      loop_control:
        label: "{{ item.stack }}"

    - name: Get Uptime Kuma API token
      ansible.builtin.include_role:
        name: uptime_kuma
        tasks_from: get-token
      when: uptime_registrations | length > 0

    - name: Register Uptime Kuma monitors for each stack the run brought up  # noqa: var-naming[no-role-prefix]
      ansible.builtin.include_role:
        name: uptime_kuma
        tasks_from: add-service-monitors
      vars:
        stack_name: "{{ item.stack }}"
        compose_file_path: "{{ item.compose }}"
      loop: "{{ uptime_registrations }}"
      loop_control:
        label: "{{ item.stack }}"
      when: uptime_kuma_api_token is defined
