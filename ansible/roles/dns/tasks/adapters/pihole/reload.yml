# ansible/roles/dns/tasks/adapters/pihole/reload.yml
---
# Record PUTs use restart=false: stored, not applied, until FTL reloads.
# Reload once after all writes; FTL also serves the API, so it refuses
# requests while restarting. Always reload: records may already be
# stored-but-unapplied from earlier runs (those adds return 400 duplicate).
- name: "[PIHOLE] Reload DNS resolver to apply stored records"
  ansible.builtin.uri:
    url: "{{ dns_secondary_api_url }}/action/restartdns"
    method: POST
    headers:
      sid: "{{ dns_pihole_session_id }}"
    status_code: [200, 204]
  delegate_to: localhost
