---
# ansible/roles/swarm/tasks/deploy-one-stack.yml
# Deploy one stack and wait for it to converge. `ci plan` decides whether it
# should be deployed; convergence is asked of `ci` too, so there is one answer
# to "is this stack up?" rather than a second one parsed here.

- name: Resolve the compose file for {{ swarm_deploy_stack }}
  ansible.builtin.set_fact:
    swarm_deploy_compose: "{{ lookup('ansible.builtin.first_found', swarm_deploy_candidates) }}"
  vars:
    swarm_deploy_candidates:
      - "{{ swarm_stacks_root }}/stacks/{{ swarm_deploy_stack }}/docker-compose.yml"
      - "{{ swarm_stacks_root }}/stacks/apps/{{ swarm_deploy_stack }}/docker-compose.yml"

- name: Run pre-flight checks and setup for {{ swarm_deploy_stack }}
  ansible.builtin.include_role:
    name: preflight
  vars:
    preflight_stack_path: "{{ swarm_deploy_compose | dirname }}"
    preflight_stack_name: "{{ swarm_deploy_stack }}"

- name: Deploy {{ swarm_deploy_stack }}
  community.docker.docker_stack:
    state: present
    name: "{{ swarm_deploy_stack }}"
    prune: "{{ prune | bool }}"
    with_registry_auth: true
    compose:
      - "{{ swarm_deploy_compose }}"
    cli_context: "{{ swarm_docker_context }}"
  environment: "{{ swarm_env_vars }}"
  delegate_to: localhost

- name: Wait for convergence — {{ swarm_deploy_stack }}
  block:
    - name: Ask ci whether the stack has converged — {{ swarm_deploy_stack }}
      ansible.builtin.command:
        cmd: >-
          uv run ci plan --json --repo-root {{ swarm_stacks_root }}
          {{ swarm_deploy_stack }}
        chdir: "{{ swarm_repo_root }}"
      delegate_to: localhost
      changed_when: false
      register: swarm_converge_probe
      until: >-
        (swarm_converge_probe.stdout | from_json
         | selectattr('stack', 'equalto', swarm_deploy_stack)
         | map(attribute='state') | first | default('')) == 'converged'
      retries: "{{ swarm_converge_retries | int }}"
      delay: "{{ swarm_converge_delay | int }}"
  rescue:
    - name: Fail naming the stack that never converged
      ansible.builtin.fail:
        msg: >-
          ✗ {{ swarm_deploy_stack }} did not converge within
          {{ swarm_converge_retries | int * swarm_converge_delay | int }}s —
          nothing that depends on it was deployed. Fix it and re-run the same
          command; everything already converged is skipped.

- name: Record the stack as deployed by this run — {{ swarm_deploy_stack }}
  ansible.builtin.set_fact:
    swarm_deployed_stacks: >-
      {{ swarm_deployed_stacks | default([]) + [{
           'stack': swarm_deploy_stack,
           'compose': swarm_deploy_compose,
           'new': swarm_deploy_is_new | bool,
         }] }}
