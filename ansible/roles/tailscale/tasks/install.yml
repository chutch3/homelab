# ansible/roles/tailscale/tasks/install.yml
---
- name: Ensure keyrings directory exists
  file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

# apt-key is gone from apt 3 (Ubuntu 25.04+). Tailscale publishes a binary
# (noarmor) keyring, so it lands directly at the path the repo line already uses.
- name: Add Tailscale GPG key
  get_url:
      url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_facts['distribution_release'] }}.noarmor.gpg"
      dest: /etc/apt/keyrings/tailscale.gpg
      mode: "0644"

- name: Add Tailscale apt repository
  apt_repository:
      repo: >
          deb [signed-by=/etc/apt/keyrings/tailscale.gpg]
          https://pkgs.tailscale.com/stable/ubuntu
          {{ ansible_facts['distribution_release'] }} main
      state: present
      filename: tailscale

- name: Install tailscale
  apt:
      name: tailscale
      state: present
      update_cache: yes
  when: tailscale_version_check.rc != 0

- name: Ensure tailscaled service is enabled and running
  service:
      name: tailscaled
      state: started
      enabled: yes
