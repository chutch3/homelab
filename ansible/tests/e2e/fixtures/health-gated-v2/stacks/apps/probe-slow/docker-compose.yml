# probe-slow again, with one env var changed so redeploying it is a real Swarm
# update rather than a no-op. Same 15s unready window as the first version.
services:
    slow:
        image: alpine:3
        command: ["sh", "-c", "sleep 15; touch /tmp/ready; sleep 600"]
        environment:
            - PROBE_GENERATION=2
        healthcheck:
            test: ["CMD-SHELL", "test -f /tmp/ready"]
            interval: 2s
            timeout: 2s
            retries: 1
            start_period: 25s
