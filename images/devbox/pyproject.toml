[project]
name = "homelab-devbox-tests"
version = "0.1.0"
description = "Shared devbox startup and persistence regression tests"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/integration"]
addopts = "--strict-markers"
