x-homelab:
    requires: [reverse-proxy]

version: "3.9"

services:
    actual_server:
        image: docker.io/actualbudget/actual-server:26.5.2
        environment:
            - ACTUAL_UPLOAD_FILE_SYNC_SIZE_LIMIT_MB=20
            - ACTUAL_UPLOAD_SYNC_ENCRYPTED_FILE_SYNC_SIZE_LIMIT_MB=50
            - ACTUAL_UPLOAD_FILE_SIZE_LIMIT_MB=20
            - DEBUG=actual:config
        volumes:
            - budget:/data
            - ssl_certs:/certs
        restart: unless-stopped
        networks:
            - traefik-public
        user: 0:100
        deploy:
            endpoint_mode: dnsrr
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.actual.rule=Host(`budget.${BASE_DOMAIN}`)"
                - "traefik.http.routers.actual.entrypoints=websecure"
                - "traefik.http.routers.actual.tls.certresolver=dns"
                - "traefik.http.services.actual.loadbalancer.server.port=5006"
                - "traefik.swarm.network=traefik-public"

                - homepage.group=Finance
                - homepage.name=Actual Budget
                - homepage.icon=mdi-cash-multiple
                - homepage.href=https://budget.${BASE_DOMAIN}/
                - homepage.description=Budgeting Application

    actual_mcp:
        # Replaced sstefanov/actual-mcp (SSE-only) with agigante80/actual-mcp-server:
        # native Streamable HTTP support, which Open WebUI's MCP connector requires
        # (it doesn't speak SSE). Also 74 tools vs. ~20, full write support.
        image: ghcr.io/agigante80/actual-mcp-server:0.11.6
        environment:
            - ACTUAL_SERVER_URL=http://actual_server:5006
            - ACTUAL_PASSWORD=${ACTUAL_PASSWORD}
            - ACTUAL_BUDGET_SYNC_ID=${ACTUAL_BUDGET_SYNC_ID}
            - MCP_BRIDGE_DATA_DIR=/app/data
            - MCP_BRIDGE_LOG_DIR=/app/logs
            - MCP_BRIDGE_STORE_LOGS=true
            # Server refuses to start unauthenticated on a non-loopback bind
            # (0.0.0.0, required in Docker) unless this is set.
            - MCP_SSE_AUTHORIZATION=${ACTUAL_MCP_AUTH_TOKEN}
        volumes:
            - mcp_data:/app/data
            - mcp_logs:/app/logs
        networks:
            - traefik-public
        deploy:
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.actual-mcp.rule=Host(`actual-mcp.${BASE_DOMAIN}`)"
                - "traefik.http.routers.actual-mcp.entrypoints=websecure"
                - "traefik.http.routers.actual-mcp.tls.certresolver=dns"
                - "traefik.http.services.actual-mcp.loadbalancer.server.port=3600"
                - "traefik.swarm.network=traefik-public"

                - homepage.group=Finance
                - homepage.name=Actual MCP
                - homepage.icon=mdi-robot-confused
                - homepage.href=https://actual-mcp.${BASE_DOMAIN}/
                - homepage.description=Actual Budget MCP Server

                # Unauthenticated health endpoint — no need to guess at status
                # codes against the auth-gated /http MCP endpoint.
                - uptime_kuma.path=/health

networks:
    traefik-public:
        external: true

volumes:
    # Actual Budget's SQLite data. Moved off CIFS onto iSCSI/OCFS2 — SQLite over SMB
    # risks corruption; this matches every other DB-backed app in the repo. See GH #105.
    budget:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/actual_server/data"

    mcp_data:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/actual_server/mcp"

    mcp_logs:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/actual_server/mcp-logs"

    # Shared TLS certs, read-only here (traefik in the reverse-proxy stack owns/writes
    # them). Moved off CIFS onto the OCFS2 app-data LUN. See GH #105.
    ssl_certs:
        name: ssl_certs
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/ssl_certs"
