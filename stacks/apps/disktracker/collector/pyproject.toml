[project]
name = "disktracker-collector"
version = "0.1.0"
description = "Scrapes retailer prices and posts them to disktracker"
requires-python = ">=3.12"
dependencies = [
    "attrs>=25",
    "disktracker-listing-text",
    "dependency-injector>=4.49.1,<5",
    "httpx>=0.27,<1",
    "python-json-logger>=4.2,<5",
]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "pytest-httpserver>=1.1,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.uv.sources]
disktracker-listing-text = { path = "../listing_text", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --cov=collector --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
# Generated by scripts/generate-api-client.sh; tested through the collector that uses it.
omit = ["disktracker_api/*"]
# The integration tests run the real `python -m collector` process; measure it too.
patch = ["subprocess"]

[tool.ruff]
extend-exclude = ["disktracker_api"]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true
files = ["collector", "tests"]
