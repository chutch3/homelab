[project]
name = "disktracker-listing-text"
version = "0.1.0"
description = "Reads MPNs, capacities, conditions, makers and specifications from listing text"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=listing_text --cov-report=term-missing --cov-fail-under=90"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.uv.build-backend]
module-name = "listing_text"
