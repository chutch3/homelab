x-homelab:
    requires: [reverse-proxy]

version: "3.9"

services:
    emby:
        image: emby/embyserver:4.10.0.5
        container_name: embyserver
        environment:
            - UID=0
            - GID=1000
            - GIDLIST=1000
        volumes:
            - emby:/config
            # The media pool via the unified `downloads` share (//NAS/downloads =
            # all_data/media), mounted at /mnt/external/media so Emby's stored
            # library paths (/mnt/external/media/{movies,tv,...}) resolve unchanged.
            # Replaces the former whole-pool //NAS/all_data mount (that share is
            # retired — it and `downloads` were two SMB doors into the same tree).
            - media:/mnt/external/media
        restart: on-failure
        networks:
            - traefik-public
        deploy:
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.emby.rule=Host(`emby.${BASE_DOMAIN}`)"
                - "traefik.http.routers.emby.entrypoints=websecure"
                - "traefik.http.routers.emby.tls.certresolver=dns"
                - "traefik.http.services.emby.loadbalancer.server.port=8096"
                - "traefik.swarm.network=traefik-public"

                - homepage.group=Media
                - homepage.name=Emby
                - homepage.icon=emby.png
                - homepage.href=https://emby.${BASE_DOMAIN}/
                - homepage.description=Media Server

networks:
    traefik-public:
        external: true

volumes:
    media:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0600,dir_mode=0770,soft,actimeo=1"
            device: "//${NAS_SERVER}/downloads"
    emby:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/emby"
