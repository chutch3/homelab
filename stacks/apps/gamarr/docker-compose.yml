version: "3.9"

services:
    gamarr:
        image: ghcr.io/chutch3/gamarr:main-vimmserial-7b0fe66
        container_name: gamarr
        environment:
            - TZ=${TZ}
            - GAMARR_PORT=5001
            - DATA_DIR=/data/gamarr
            - GAMARR_SOURCES_PATH=/data/gamarr/sources.json
            - PROWLARR_URL=http://prowlarr:9696
            - PROWLARR_API_KEY=${GAMARR_PROWLARR_API_KEY}
            - PROWLARR_GAME_INDEXERS=${GAMARR_PROWLARR_GAME_INDEXERS:-7,5,15,9,8,3,4}
            - QB_URL=http://qbittorrent:8080
            - QB_USER=${GAMARR_QB_USER}
            - QB_PASS=${GAMARR_QB_PASS}
            - QB_CATEGORY=games
            - QB_SAVE_PATH=/data/downloads/roms
            - SABNZBD_URL=http://sabnzbd:8080
            - SABNZBD_API_KEY=${GAMARR_SABNZBD_API_KEY}
            - SABNZBD_CATEGORY=games
            - GAMES_VAULT_PATH=/data/games/vault
            - GAMES_ROMS_PATH=/data/games/roms
            - EXTRACT_ARCHIVES=true
            - RAWG_API_KEY=${GAMARR_RAWG_API_KEY}
            - ROMM_URL=https://romm.${BASE_DOMAIN}
        volumes:
            - gamarr_config:/data/gamarr
            - downloads:/data/downloads
            - games:/data/games
        restart: unless-stopped
        networks:
            - traefik-public
        deploy:
            placement:
                constraints:
                    - node.role == manager
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.gamarr.rule=Host(`gamarr.${BASE_DOMAIN}`)"
                - "traefik.http.routers.gamarr.entrypoints=websecure"
                - "traefik.http.routers.gamarr.tls.certresolver=dns"
                - "traefik.http.routers.gamarr.middlewares=authentik@swarm"
                - "traefik.http.services.gamarr.loadbalancer.server.port=5001"
                - "traefik.swarm.network=traefik-public"
                - homepage.group=Downloads
                - homepage.name=Gamarr
                - homepage.icon=mdi-gamepad-variant
                - homepage.href=https://gamarr.${BASE_DOMAIN}/
                - homepage.description=Game & ROM Management

networks:
    traefik-public:
        external: true

volumes:
    gamarr_config:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/gamarr"

    # Unified media share (//NAS/downloads -> all_data/media). Gamarr stages completed
    # game/ROM downloads under downloads/roms, then imports into the games library below.
    downloads:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/downloads"

    games:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/games"
