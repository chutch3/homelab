version: "3.9"

services:
    gamarr:
        image: ghcr.io/chutch3/gamarr:main-vimmresume-a385f28
        container_name: gamarr
        environment:
            - TZ=${TZ}
            - GAMARR_PORT=5001
            - DATA_DIR=/data/gamarr
            - GAMARR_SOURCES_PATH=/data/gamarr/sources.json
            # DDL-only (archive.org / Vimm via sources.json). No Prowlarr (blank
            # API key) or SABnzbd (blank URL/key), so no indexer/usenet grabs.
            # qBittorrent can't be disabled by blanking QB_URL — the app falls back
            # to a default URL when the var is empty — so disable the torrent
            # completion poller directly. The qB client is then never invoked (its
            # only caller runs on torrent-protocol results, which never occur here).
            - WATCHER_ENABLED=false
            # DDL downloads stage here (node-local scratch) before gamarr imports
            # them onto the games share below.
            - QB_SAVE_PATH=/data/staging
            - GAMES_VAULT_PATH=/data/games/vault
            - GAMES_ROMS_PATH=/data/games/roms
            - EXTRACT_ARCHIVES=true
            - RAWG_API_KEY=${GAMARR_RAWG_API_KEY}
            - ROMM_URL=https://romm.${BASE_DOMAIN}
        volumes:
            - gamarr_config:/data/gamarr
            - games:/data/games
            - gamarr_staging:/data/staging
        restart: unless-stopped
        networks:
            - traefik-public
        deploy:
            # SQLite (WAL) config DB lives on the OCFS2 cluster LUN, which is
            # mounted on every node, so the service can float. replicas:1 +
            # stop-first guarantees a single writer — the old task stops before
            # the new one starts, so two instances never open the DB at once.
            replicas: 1
            update_config:
                order: stop-first
                parallelism: 1
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.gamarr.rule=Host(`gamarr.${BASE_DOMAIN}`)"
                - "traefik.http.routers.gamarr.entrypoints=websecure"
                - "traefik.http.routers.gamarr.tls.certresolver=dns"
                - "traefik.http.routers.gamarr.middlewares=authentik@swarm"
                - "traefik.http.services.gamarr.loadbalancer.server.port=5001"
                - "traefik.swarm.network=traefik-public"
                - homepage.group=Downloads
                - homepage.name=Gamarr
                - homepage.icon=mdi-gamepad-variant
                - homepage.href=https://gamarr.${BASE_DOMAIN}/
                - homepage.description=Game & ROM Management

networks:
    traefik-public:
        external: true

volumes:
    gamarr_config:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/gamarr"

    # Node-local scratch for DDL downloads in progress. Docker-managed under
    # /var/lib/docker on whatever node the service lands on — deliberately off
    # both CIFS and the iSCSI LUN. Throwaway: a failed/interrupted DDL is deleted
    # and re-fetched (no resume), so it need not survive a reschedule.
    gamarr_staging:
        driver: local

    games:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/games"
