# Create the swarm secret Fiber reads to dump this DB.
secrets:
  - name: librechat_db_password
    from_env: POSTGRES_PASSWORD

validate:
  env:
    - POSTGRES_PASSWORD

directories:
  # Reproduces the old CIFS grant (uid=0,gid=100,0777) so the api container writes
  # regardless of its runtime uid; tighten once that uid is confirmed. See GH #105.
  - { path: librechat/logs, base: app_data, owner: 0, group: 100, mode: "0777" }
  - { path: librechat/images, base: app_data, owner: 0, group: 100, mode: "0777" }
  - { path: librechat/uploads, base: app_data, owner: 0, group: 100, mode: "0777" }
