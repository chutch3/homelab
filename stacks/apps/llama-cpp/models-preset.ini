# Per-model settings for llama-server's router mode (--models-preset).
# Section name = the model id clients request (kept identical to the old
# Ollama tags so Open WebUI's model list looks the same as before).
#
# ctx-size values below are live-measured against the 3090's 24GB, not
# guesses — see the VRAM figure noted per model. Open WebUI's MCP tool
# definitions alone run ~6-9K tokens, so anything much below ~16K risks the
# "request exceeds available context size" error.

# qwen3.6's hybrid Gated DeltaNet/attention architecture makes its KV cache
# unusually cheap: ctx-size 65536 measured at 21.3GB total (only ~1GB more
# than ctx-size 4096's 20GB), leaving ~3.2GB headroom. Don't assume other
# models scale this cheaply — measure before raising their ctx-size.
[qwen3.6:35b]
model = /models/qwen3.6-35b.gguf
ctx-size = 65536

[qwen3-coder:30b]
model = /models/qwen3-coder-30b.gguf
ctx-size = 16384

[qwen2.5:14b]
model = /models/qwen2.5-14b.gguf
ctx-size = 24576

[qwen3:14b]
model = /models/qwen3-14b.gguf
ctx-size = 24576

[mistral-nemo:12b]
model = /models/mistral-nemo-12b.gguf
ctx-size = 24576

[llama3.1:8b]
model = /models/llama3.1-8b.gguf
ctx-size = 24576

# Embedding model. `--embeddings` mode confirmed working via /v1/embeddings.
[qwen3-embedding:8b]
model = /models/qwen3-embedding-8b.gguf
ctx-size = 8192
embedding = true
