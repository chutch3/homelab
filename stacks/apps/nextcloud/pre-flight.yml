# Create the swarm secret Fiber reads to dump this DB.
secrets:
  - name: nextcloud_db_password
    from_env: NEXTCLOUD_DB_PASSWORD

directories:
  - { path: "nextcloud/postgresql", base: app_data }
  - { path: "nextcloud/html", base: app_data }
  - { path: "nextcloud/data", base: app_data }
  - { path: "nextcloud-redis", base: cache }

validate:
  env:
    - NEXTCLOUD_DB_PASSWORD
    - NEXTCLOUD_ADMIN_USERNAME
    - NEXTCLOUD_ADMIN_PASSWORD
  labels:
    - database: "true"
