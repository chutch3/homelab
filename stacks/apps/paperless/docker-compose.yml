version: "3.9"

services:
    paperless-broker:
        image: docker.io/valkey/valkey:9-alpine
        volumes:
            - paperless_broker:/data
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "valkey-cli ping || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
        networks:
            - traefik-public
        deploy:
            replicas: 1

    paperless-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ${PAPERLESS_DB_USER:-paperless}
            POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
            POSTGRES_DB: ${PAPERLESS_DB_NAME:-paperless}
        volumes:
            - paperless_db:/var/lib/postgresql/data
        restart: unless-stopped
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "pg_isready -d ${PAPERLESS_DB_NAME:-paperless} -U ${PAPERLESS_DB_USER:-paperless}",
                ]
            interval: 30s
            timeout: 5s
            retries: 5
            start_period: 3m
        networks:
            - traefik-public
            - backups
        deploy:
            replicas: 1
            placement:
                constraints:
                    - node.labels.database == true
            labels:
                - "fiber.enable=true"
                - "fiber.provider=swarm"
                - "fiber.engine=postgres"
                - "fiber.dbname=${PAPERLESS_DB_NAME:-paperless}"
                - "fiber.user=${PAPERLESS_DB_USER:-paperless}"
                - "fiber.secret=paperless_db_password"
                - "fiber.schedule=0 3 * * *"

    paperless-webserver:
        image: ghcr.io/paperless-ngx/paperless-ngx:latest
        environment:
            - PAPERLESS_REDIS=redis://paperless-broker:6379
            - PAPERLESS_DBHOST=paperless-db
            - PAPERLESS_DBPORT=5432
            - PAPERLESS_DBNAME=${PAPERLESS_DB_NAME:-paperless}
            - PAPERLESS_DBUSER=${PAPERLESS_DB_USER:-paperless}
            - PAPERLESS_DBPASS=${PAPERLESS_DB_PASSWORD}
            - PAPERLESS_SECRET_KEY=${PAPERLESS_SECRET_KEY}
            - PAPERLESS_URL=https://paperless.${BASE_DOMAIN}
            - PAPERLESS_TIME_ZONE=${TZ}
            - PAPERLESS_OCR_LANGUAGE=eng
            - USERMAP_UID=1000
            - USERMAP_GID=1000
            - PAPERLESS_ADMIN_USER=${PAPERLESS_ADMIN_USERNAME}
            - PAPERLESS_ADMIN_PASSWORD=${PAPERLESS_ADMIN_PASSWORD}
            # Authentik OIDC Configuration — kept alongside the local admin login
            # (not PAPERLESS_DISABLE_REGULAR_LOGIN) as a fallback, same as mealie/immich.
            - PAPERLESS_APPS=allauth.socialaccount.providers.openid_connect
            - PAPERLESS_SOCIAL_AUTO_SIGNUP=true
            - PAPERLESS_SOCIALACCOUNT_PROVIDERS={"openid_connect":{"APPS":[{"provider_id":"authentik","name":"Authentik","client_id":"${PAPERLESS_OAUTH_CLIENT_ID}","secret":"${PAPERLESS_OAUTH_CLIENT_SECRET}","settings":{"server_url":"https://auth.${BASE_DOMAIN}/application/o/paperless/.well-known/openid-configuration"}}]}}
        volumes:
            - paperless_data:/usr/src/paperless/data
            - paperless_media:/usr/src/paperless/media
            - paperless_consume:/usr/src/paperless/consume
        restart: unless-stopped
        depends_on:
            - paperless-db
            - paperless-broker
        networks:
            - traefik-public
        deploy:
            replicas: 1
            resources:
                limits:
                    memory: 2000M
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.paperless.rule=Host(`paperless.${BASE_DOMAIN}`)"
                - "traefik.http.routers.paperless.entrypoints=websecure"
                - "traefik.http.routers.paperless.tls.certresolver=dns"
                - "traefik.http.services.paperless.loadbalancer.server.port=8000"
                - "traefik.swarm.network=traefik-public"

                - homepage.group=Productivity
                - homepage.name=Paperless-ngx
                - homepage.icon=paperless-ngx.png
                - homepage.href=https://paperless.${BASE_DOMAIN}/
                - homepage.description=Document management — OCR & full-text search

networks:
    traefik-public:
        external: true
    backups:
        external: true

volumes:
    paperless_db:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/paperless/postgresql"

    # Classifier model + task state — small, POSIX-sensitive.
    paperless_data:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/paperless/data"

    # Originals/archive/thumbnails. On app-data for now (personal document corpus,
    # not large-media scale) — revisit and move to CIFS if it grows large, same
    # call as archivebox.
    paperless_media:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/paperless/media"

    # Scan/drop folder — files here are consumed and removed, so it stays tiny.
    paperless_consume:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/paperless/consume"

    paperless_broker:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/cache/paperless-broker"
