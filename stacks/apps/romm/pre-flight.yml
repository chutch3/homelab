# Create the swarm secret Fiber reads to dump this DB.
secrets:
  - name: romm_db_password
    from_env: ROMM_DB_PASSWORD

validate:
  env:
    - ROMM_DB_PASSWORD
    - ROMM_DB_ROOT_PASSWORD
    - ROMM_AUTH_SECRET_KEY
  labels:
    - database: "true"

# RomM app runs as uid/gid 1000. DB + redis use node-local docker volumes.
directories:
  - { path: romm/resources, owner: 1000, group: 1000 }
  - { path: romm/assets, owner: 1000, group: 1000 }
  - { path: romm/config, owner: 1000, group: 1000 }
