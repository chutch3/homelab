version: "3.9"

services:
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        container_name: sonarr
        environment:
            - PUID=1000
            - PGID=1000
            - UMASK=002
            - TZ=${TZ}
        volumes:
            - sonarr_config:/config
            - downloads:/data/downloads
        restart: unless-stopped
        networks:
            - traefik-public
        deploy:
            endpoint_mode: dnsrr
            labels:
                - "traefik.enable=true"
                - "traefik.http.routers.sonarr.rule=Host(`sonarr.${BASE_DOMAIN}`)"
                - "traefik.http.routers.sonarr.entrypoints=websecure"
                - "traefik.http.routers.sonarr.tls.certresolver=dns"
                - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
                - "traefik.swarm.network=traefik-public"
                - homepage.group=Downloads
                - homepage.name=Sonarr
                - homepage.icon=sonarr.png
                - homepage.href=https://sonarr.${BASE_DOMAIN}/
                - homepage.description=TV Show Management

networks:
    traefik-public:
        external: true

volumes:
    sonarr_config:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/media-apps/sonarr"

    # Unified media share (//NAS/downloads -> all_data/media): movies, tv, comics,
    # manga, incomplete, roms. Replaces the former split torrents/usenet shares.
    # actimeo=1 (not the CIFS default 30s): Sonarr's own mount was caching stale
    # attributes for files SABnzbd/NZBGet had just finished writing on their
    # separate mounts, causing spurious "Failed to import episode" rejections
    # that only cleared on a manual re-scan once the cache expired.
    downloads:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=1"
            device: "//${NAS_SERVER}/downloads"
