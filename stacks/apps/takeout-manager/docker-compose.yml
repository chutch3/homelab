version: "3.9"

services:
    takeout-manager:
        # For Docker Swarm, use pre-built images from a registry
        # Registry options:
        #   - GitHub Container Registry: ghcr.io/YOUR_USERNAME/takeout-manager:latest
        #   - Docker Hub: YOUR_USERNAME/takeout-manager:latest
        #   - Private Registry: registry.YOUR_DOMAIN.com/takeout-manager:latest
        image: ${REGISTRY:-ghcr.io}/${REGISTRY_NAMESPACE:-chutch3}/takeout-manager:${IMAGE_TAG:-3.22.0}
        build:
            context: manager
            dockerfile: Dockerfile
        x-homelab:
            watch:
                - stacks/apps/takeout-manager/manager/**
        container_name: takeout-manager
        restart: unless-stopped
        volumes:
            - takeout-manager-db:/app/db
            # Read-only view of the downloaded archives so the Archives page can
            # list them (reconciled with the DB). Worker owns the writes.
            - takeout-downloads:/downloads:ro
        networks:
            - traefik-public
        environment:
            - TZ=${TZ:-UTC}
            - PUID=${PUID:-1000}
            - PGID=${PGID:-1000}
            - APP_ARCHIVES_DIR=/downloads
        deploy:
            replicas: 1
            placement:
                constraints:
                    # Run on manager node if iSCSI is only available there
                    # Comment out if iSCSI is available on all nodes
                    - node.role == manager
            labels:
                # Traefik Labels
                - "traefik.enable=true"
                - "traefik.http.routers.takeout-manager.rule=Host(`takeout.${BASE_DOMAIN}`)"
                - "traefik.http.routers.takeout-manager.entrypoints=websecure"
                - "traefik.http.routers.takeout-manager.tls.certresolver=dns"
                - "traefik.http.services.takeout-manager.loadbalancer.server.port=8000"
                - "traefik.swarm.network=traefik-public"

                # Homepage Labels
                - "homepage.group=Services"
                - "homepage.name=Takeout Manager"
                - "homepage.icon=mdi-download-box"
                - "homepage.href=https://takeout.${BASE_DOMAIN}"
                - "homepage.description=Google Photos Takeout Management"

    takeout-worker:
        image: ${REGISTRY:-ghcr.io}/${REGISTRY_NAMESPACE:-chutch3}/takeout-worker:${IMAGE_TAG:-3.22.0}
        build:
            context: worker
            dockerfile: Dockerfile
        x-homelab:
            watch:
                - stacks/apps/takeout-manager/worker/**
        container_name: takeout-worker
        restart: unless-stopped
        # Must match the CIFS mounts' uid=1000,gid=1000 (below) — the container
        # otherwise runs as root, which the CIFS client denies write access to.
        user: "${PUID:-1000}:${PGID:-1000}"
        volumes:
            - takeout-staging:/staging
            - takeout-downloads:/downloads
            - takeout-pictures:/pictures
            - takeout-videos:/videos
        networks:
            - traefik-public # So it can communicate with the manager
        environment:
            - TZ=${TZ:-UTC}
            - PUID=${PUID:-1000}
            - PGID=${PGID:-1000}
            - MANAGER_URL=http://takeout-manager:8000
        deploy:
            mode: global # Run one instance of the worker on every node

networks:
    traefik-public:
        external: true

volumes:
    # Manager Database (iSCSI - Block)
    takeout-manager-db:
        driver: local
        driver_opts:
            type: "none"
            o: "bind"
            device: "/mnt/iscsi/app-data/takeout-manager"

    # Node-local scratch for in-progress downloads. Docker-managed under
    # /var/lib/docker on whatever node the worker task lands on (mode: global,
    # so every node gets its own) — deliberately off the CIFS mount. A download
    # is written and integrity-checked here, then moved onto the CIFS share in
    # a single local-read/CIFS-write pass, avoiding the multi-minute streamed
    # write directly to CIFS that was truncating on NAS load (Kopia backups,
    # etc). A confirmed-corrupt download is deleted so a retry starts fresh
    # rather than resuming (curl -C -) onto bad bytes; a plain transient
    # failure leaves the partial file in place so resume can still help.
    takeout-staging:
        driver: local

    # Worker Volumes (SMB/CIFS - File)
    takeout-downloads:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/google_photos_takeout"

    # Extraction targets now live under the consolidated home_media tree (SSD mirror),
    # so immich indexes them alongside home pictures/videos. The former
    # standalone google_photos_pictures/google_photos_videos shares were retired.
    takeout-pictures:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/home_media/google_photos/pictures"

    takeout-videos:
        driver: local
        driver_opts:
            type: "cifs"
            o: "username=${SMB_USERNAME},password=${SMB_PASSWORD},domain=${SMB_DOMAIN},vers=3.0,file_mode=0770,dir_mode=0770,uid=1000,gid=1000,soft,actimeo=30"
            device: "//${NAS_SERVER}/home_media/google_photos/videos"
