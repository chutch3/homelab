[project]
name = "homelab-tor-audio"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-cov>=7.0.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests/integration"]
addopts = "--strict-markers --cov=install --cov-report=term-missing --cov-fail-under=90"
