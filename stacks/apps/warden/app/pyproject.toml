[project]
name = "warden"
version = "0.1.0"
description = "Quota-aware *arr hunter and queue janitor"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "dependency-injector>=4.48.0",
    "httpx>=0.27.0",
    "sqlmodel>=0.0.38",
    "prometheus-client>=0.21.0",
    "tzdata>=2024.1",
    "python-json-logger>=2.0.7,<3",
    "pyyaml>=6.0.3",
    "jsonschema>=4.26.0",
]

[project.scripts]
warden = "warden.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.12.0",
    "import-linter>=2.11",
    "pytest-cov>=7.1.0",
    "polyfactory>=3.3.0",
    "pytest-httpserver>=1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: needs external services (real process / fakes / docker)",
    "e2e: full black-box end-to-end (docker compose)",
]
addopts = "--strict-markers --cov=warden --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
patch = ["subprocess"]
sigterm = true

[tool.importlinter]
root_package = "warden"

[[tool.importlinter.contracts]]
name = "Circle Architecture rings"
type = "layers"
layers = ["warden.routes", "warden.services", "warden.repositories", "warden.clients"]
