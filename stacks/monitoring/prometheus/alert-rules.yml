groups:
  - name: status-pipeline
    interval: 30s
    rules:
      - alert: StatusPipelineRequestSurge
        expr: rate(minio_bucket_requests_total{bucket="public-status",api="getobject"}[5m]) > 5
        for: 5m
        labels:
          severity: warning
          component: status-pipeline
        annotations:
          summary: "Elevated traffic to public status endpoint"
          description: "{{ $value | printf \"%.2f\" }} req/s on public-status for the last 5 minutes (threshold: 5 req/s)"

      - alert: StatusPipelineAbuse
        expr: rate(minio_bucket_requests_total{bucket="public-status",api="getobject"}[5m]) > 50
        for: 2m
        labels:
          severity: critical
          component: status-pipeline
          action: kill-funnel
        annotations:
          summary: "Status pipeline being slammed — consider killing Funnel"
          description: "{{ $value | printf \"%.2f\" }} req/s sustained for 2m. Run: task status-pipeline:funnel:off"

      - alert: StatusPipelineHighBandwidth
        expr: rate(minio_bucket_traffic_sent_bytes{bucket="public-status"}[5m]) > 5242880
        for: 5m
        labels:
          severity: warning
          component: status-pipeline
        annotations:
          summary: "Status pipeline sending high bandwidth"
          description: "{{ $value | humanize }}B/s outbound from public-status (threshold: 5 MB/s)"

      - alert: StatusPipelineStale
        expr: time() - minio_bucket_usage_last_activity_nano_seconds{bucket="public-status"} / 1e9 > 1800
        for: 5m
        labels:
          severity: warning
          component: status-pipeline
        annotations:
          summary: "Status pipeline not syncing"
          description: "No activity on public-status bucket for >30min. Cron may be broken — check logs: task status-pipeline:logs"

  - name: fiber
    interval: 30s
    rules:
      - alert: FiberBackupStale
        expr: time() - max by (db) (fiber_last_success_timestamp) > 129600
        for: 10m
        labels:
          severity: warning
          component: fiber
        annotations:
          summary: "Fiber: {{ $labels.db }} has no clean dump in 36h"
          description: "No successful dump for {{ $labels.db }} in over 36h — check the Throne Room."

      - alert: FiberBackupClogged
        expr: increase(fiber_movements_total{status="clogged"}[1h]) > 0
        for: 5m
        labels:
          severity: warning
          component: fiber
        annotations:
          summary: "Fiber: {{ $labels.db }} dump failed (clogged)"
          description: "A dump for {{ $labels.db }} failed in the last hour — pull the stool sample in the drawer."

  - name: beholder
    interval: 30s
    rules:
      - alert: BeholderStale
        expr: time() - beholder_last_run_timestamp_seconds > 90000
        for: 10m
        labels:
          severity: warning
          component: beholder
        annotations:
          summary: "Beholder has not run in over 25h"
          description: "Last completed run was {{ $value | humanizeDuration }} ago (daily run expected every ~24h). The watchdog may be down — nothing is watching the budget. Check logs: docker service logs $(docker service ls -qf name=beholder)"

      - alert: BeholderRunFailed
        expr: beholder_last_run_success == 0
        for: 5m
        labels:
          severity: critical
          component: beholder
        annotations:
          summary: "Beholder's last run failed — the watchdog itself needs attention"
          description: "The most recent run did not complete, so the budget checks did not run. Beholder also emails a 'run failed' alert; investigate the Actual sync and beholder logs."

  - name: storage
    interval: 30s
    rules:
      - alert: NodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 5m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "node-exporter on {{ $labels.instance }} is down or not answering"
          description: "No scrape from {{ $labels.instance }} for 5m. node-exporter blocks when a mount hangs, so check /mnt/iscsi on that node before assuming the node is off."

      - alert: StorageProcessesBlocked
        expr: node_procs_blocked > 10
        for: 10m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "{{ $value }} processes blocked on I/O on {{ $labels.instance }}"
          description: "More than 10 processes have been stuck waiting on I/O for 10m — the usual sign of a stalled OCFS2/iSCSI mount. Check: ps -eo state,pid,etimes,comm | awk '$1==\"D\"'"

      - alert: IscsiFilesystemDeviceError
        expr: node_filesystem_device_error{mountpoint=~"/mnt/iscsi/.+"} == 1
        for: 5m
        labels:
          severity: critical
          component: storage
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is not answering statfs"
          description: "node-exporter could not stat {{ $labels.mountpoint }} for 5m — the mount is hung or erroring."

  - name: monitoring-health
    interval: 30s
    rules:
      - alert: TargetDown
        expr: up{job!="node-exporter"} == 0
        for: 10m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "Scrape target {{ $labels.instance }} ({{ $labels.job }}) is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 10m, so every alert built on its metrics is blind."

      - alert: AlertDeliveryFailing
        expr: increase(alertmanager_notification_requests_failed_total[15m]) > 0
        for: 5m
        labels:
          severity: critical
          component: alerting
        annotations:
          summary: "Alertmanager is failing to send {{ $labels.integration }} notifications"
          description: "{{ $value | printf \"%.0f\" }} failed send attempts in the last 15m. Other alerts may not be reaching you. Check: docker service logs monitoring_alertmanager"

      - alert: BeholderMetricsMissing
        expr: absent(beholder_last_run_timestamp_seconds)
        for: 30m
        labels:
          severity: warning
          component: beholder
        annotations:
          summary: "Beholder is not reporting metrics"
          description: "beholder_last_run_timestamp_seconds has been absent for 30m, so BeholderStale and BeholderRunFailed cannot fire. The service is probably down."

      - alert: FiberMetricsMissing
        expr: absent(fiber_last_success_timestamp)
        for: 30m
        labels:
          severity: warning
          component: fiber
        annotations:
          summary: "Fiber is not reporting metrics"
          description: "fiber_last_success_timestamp has been absent for 30m, so FiberBackupStale cannot fire. The service is probably down."
