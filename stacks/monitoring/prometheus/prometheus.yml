global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "alertmanager"
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: "docker"
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:9323
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id
      - source_labels: [__meta_dockerswarm_node_role]
        target_label: node_role

  - job_name: "node-exporter"
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:9100
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id

  - job_name: "cadvisor"
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:8080
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id

  - job_name: "swarm-tasks"
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: tasks
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__meta_dockerswarm_service_label_prometheus_scrape]
        regex: "true"
        action: keep
      - source_labels: [__meta_dockerswarm_service_label_prometheus_port]
        regex: (.+)
        target_label: __address__
        replacement: $1
      - source_labels: [__meta_dockerswarm_service_label_prometheus_path]
        regex: (.+)
        target_label: __metrics_path__
        replacement: $1
      - source_labels: [__meta_dockerswarm_service_name, __meta_dockerswarm_task_slot]
        separator: "_"
        target_label: instance
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: service
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node

  - job_name: "traefik"
    static_configs:
      - targets: ["traefik:9100"]

  - job_name: "nvidia-gpu"
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:9400
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id
      - source_labels: [__meta_dockerswarm_node_label_gpu]
        regex: "(true|True)"
        action: keep

  - job_name: "speedtest"
    scrape_interval: 30m
    scrape_timeout: 2m
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:9798
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id
      - source_labels: [__meta_dockerswarm_node_role]
        regex: manager
        action: keep

  - job_name: "minio-cluster"
    metrics_path: /minio/v2/metrics/cluster
    bearer_token_file: /run/secrets/status_pipeline_minio_token
    scheme: https
    file_sd_configs:
      - files:
          - /tmp/targets/minio.json

  - job_name: "minio-bucket"
    metrics_path: /minio/v2/metrics/bucket
    bearer_token_file: /run/secrets/status_pipeline_minio_token
    scheme: https
    file_sd_configs:
      - files:
          - /tmp/targets/minio.json

  - job_name: "iperf3-bandwidth"
    metrics_path: /probe
    scrape_interval: 30m
    scrape_timeout: 5m
    dockerswarm_sd_configs:
      - host: unix:///var/run/docker.sock
        role: nodes
    relabel_configs:
      - target_label: __param_target
        replacement: 172.17.0.1:5201
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: instance
      - source_labels: [__meta_dockerswarm_node_id]
        target_label: node_id
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_node_address]
        target_label: __address__
        replacement: $1:9579
