[project]
name = "ci"
version = "0.1.0"
description = "Monorepo CI/build tooling: change detection and build helpers."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "dependency-injector>=4.49"]

[project.scripts]
# One CLI for the repo's build/test tooling: `ci affected`, `ci test`.
ci = "ci.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ci"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The e2e tier builds a throwaway swarm, so it is opt-in: `ci test --tier e2e`
# clears addopts (a single tier is never coverage-gated), which re-selects it.
addopts = "-m 'not e2e'"
markers = ["e2e: needs a real docker swarm on the local daemon"]
